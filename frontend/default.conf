server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # /api/auth/login  ->  http://auth:8080/login
    location /api/auth/ {
        proxy_pass http://auth:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/snake/score ->  http://snake:8080/score
    location /api/snake/ {
        proxy_pass http://snake:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
